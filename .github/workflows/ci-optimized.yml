name: CI - Optimized

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('lab5/sample-ci/backend/**/*.csproj') }}

      - name: Restore dependencies
        working-directory: lab5/sample-ci/backend/ProductApi
        run: dotnet restore

      - name: Build
        working-directory: lab5/sample-ci/backend/ProductApi
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: lab5/sample-ci/backend/ProductApi.Tests
        run: dotnet test --no-build --configuration Release --logger trx

      - name: Publish
        working-directory: lab5/sample-ci/backend/ProductApi
        run: dotnet publish --no-build --configuration Release --output ./publish

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json

      - name: Install dependencies
        working-directory: lab5/sample-ci/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: lab5/sample-ci/frontend
        run: npm test

      - name: Build frontend
        working-directory: lab5/sample-ci/frontend
        run: npm run build
